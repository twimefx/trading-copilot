name: build-kronos-gpu

# Builds the CUDA Kronos image and pushes it to GHCR (GitHub Container Registry).
# Trigger manually (workflow_dispatch) or on changes to the Kronos service on master.
# Uses the built-in GITHUB_TOKEN with packages:write — no extra secret needed.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "services/kronos/**"
      - ".github/workflows/build-kronos-gpu.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kronos-gpu
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/kronos/Dockerfile.gpu
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
